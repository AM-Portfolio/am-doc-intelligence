replicaCount: 1
port: 8080
service:
  port: 8080
healthPath: /doc-ui/
language: flutter

global:
  vault:
    serviceAccountName: "am-frontend-sa"
  image:
    imagePullSecrets:
      - name: github-registry-secret

image:
  repository: am-doc-viewer-ui
  pullPolicy: Always
  tag: "latest"

ingress:
  enabled: false

security:
  automountServiceAccountToken: true

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi

vault:
  enabled: false

nodeSelector:
  role: services
