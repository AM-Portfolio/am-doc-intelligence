version: '3.8'

services:
  # --- Cloudinary Manager (Java/Spring) ---
  am-cloudinary-service:
    container_name: am-cloudinary-service
    build:
      context: ./services/am-cloudinary-manager
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - TZ=Asia/Kolkata
    ports:
      - "8074:8080"
    networks:
      - am-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # --- Document Processor (Java/Spring) ---
  am-document-processor:
    container_name: am-document-processor
    build:
      context: ./services/am-document-processor
      dockerfile: Dockerfile
      args:
        - GITHUB_PACKAGES_USERNAME=${GITHUB_PACKAGES_USERNAME}
        - GITHUB_PACKAGES_TOKEN=${GITHUB_PACKAGES_TOKEN}
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - MONGODB_URL=${MONGODB_URL}
      - MONGODB_DATABASE=${MONGODB_DATABASE}
      - MONGODB_USERNAME=${MONGODB_USERNAME}
      - MONGODB_PASSWORD=${MONGODB_PASSWORD}
      - MONGODB_AUTHENTICATION_DATABASE=admin
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - SPRING_KAFKA_CONSUMER_GROUP_ID=${KAFKA_CONSUMER_GROUP_ID}
      - APP_KAFKA_TOPIC_DOCUMENT_UPLOADED=${KAFKA_TOPIC_DOCUMENT_UPLOADED}
      - APP_KAFKA_TOPIC_DOCUMENT_PROCESSED=${KAFKA_TOPIC_DOCUMENT_PROCESSED}
    ports:
      - "8081:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - am-network
    restart: unless-stopped

  # --- Email Extractor (Python/Flask) ---
  am-email-extractor:
    container_name: am-email-extractor
    build:
      context: ./services/am-email-extractor
      dockerfile: Dockerfile
    environment:
      - MONGODB_URL=${MONGODB_URL}
      - MONGO_DATABASE=${MONGODB_DATABASE}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GMAIL_REDIRECT_URI=${GMAIL_REDIRECT_URI:-http://localhost:8080/api/v1/gmail/callback}
    volumes:
      - ./services/am-email-extractor/user_tokens:/app/user_tokens
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - am-network
    restart: unless-stopped

  # --- Doc Viewer UI (Flutter) ---
  am-doc-viewer-ui:
    container_name: am-doc-viewer-ui
    build:
      context: ./apps/am-doc-viewer-ui
      dockerfile: Dockerfile
    ports:
      - "9004:80"
    networks:
      - am-network
    restart: unless-stopped

networks:
  am-network:
    name: am-network
    driver: bridge
