# am-security-lib OIDC resource-server config (same pattern as am-analysis / am-cloudinary).
am:
  security:
    enabled: true
    proxy-name: "document-processor"
    oidc:
      jwk-set-uri: ${OIDC_JWKS_URI:http://localhost:8001/realms/am-realm/protocol/openid-connect/certs}
      issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8001/realms/am-realm}
      client-id: ${OAUTH2_CLIENT_ID:am-document-processor-client}
      client-secret: ${OAUTH2_CLIENT_SECRET:secret}
    public-paths:
      - "/actuator/**"
      - "/document-processor/actuator/**"
      - "/v1/documents/types"
      - "/swagger-ui/**"
      - "/v3/api-docs/**"
      - "/v3/api-docs.yaml"
    protected-paths:
      - "/v1/**"
  api:
    core:
      exception-handler:
        enabled: true
