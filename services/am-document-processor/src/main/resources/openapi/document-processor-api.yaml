openapi: 3.0.3
info:
  title: Document Processor API
  description: API for processing portfolio documents from various brokers
  version: 1.0.0
  contact:
    name: AM Portfolio Team

servers:
  - url: /api/v1
    description: Base API path

tags:
  - name: Documents
    description: Document processing operations

paths:
  /documents/process:
    post:
      tags:
        - Documents
      summary: Process a single document
      description: Upload and process a single portfolio document
      operationId: processDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Portfolio document file to process
                documentType:
                  type: string
                  enum: [STOCK_PORTFOLIO, MUTUAL_FUND_PORTFOLIO]
                  description: Type of document being processed
              required:
                - file
                - documentType
      responses:
        '200':
          description: Document processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentProcessResponse'
        '400':
          description: Invalid input parameters
        '500':
          description: Internal server error

  /documents/batch-process:
    post:
      tags:
        - Documents
      summary: Process multiple documents
      description: Upload and process multiple portfolio documents
      operationId: processBatchDocuments
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: List of portfolio document files to process
                documentType:
                  type: string
                  enum: [STOCK_PORTFOLIO, MUTUAL_FUND_PORTFOLIO]
                  description: Type of documents being processed
              required:
                - files
                - documentType
      responses:
        '200':
          description: Documents processed successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentProcessResponse'
        '400':
          description: Invalid input parameters
        '500':
          description: Internal server error

  /documents/status/{processId}:
    get:
      tags:
        - Documents
      summary: Get document processing status
      description: Retrieve the current status of a document processing request
      operationId: getProcessingStatus
      parameters:
        - name: processId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Unique identifier of the processing request
      responses:
        '200':
          description: Processing status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingStatus'
        '404':
          description: Process ID not found
        '500':
          description: Internal server error

  /documents/sync:
    post:
      tags:
        - Documents
      summary: Submit a multi-broker batch sync
      description: |
        Accepts up to 5 files from different brokers. Broker type and document type
        are auto-detected per file unless hints are provided. Processing is async —
        poll GET /documents/sync/{batchId}/status for progress.
      operationId: submitBatchSync
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - files
              properties:
                files:
                  type: array
                  maxItems: 5
                  items:
                    type: string
                    format: binary
                  description: Files to process (one or more, different brokers allowed)
                brokerTypes:
                  type: array
                  items:
                    type: string
                    example: ZERODHA
                  description: Optional per-file broker hints (same order as files)
                documentTypes:
                  type: array
                  items:
                    type: string
                    example: STOCK_PORTFOLIO
                  description: Optional per-file document type hints (same order as files)
                passwords:
                  type: array
                  items:
                    type: string
                  description: Optional per-file passwords for encrypted files
                portfolioIds:
                  type: array
                  items:
                    type: string
                    example: My Zerodha
                  description: Optional per-file portfolio names/IDs (same order as files)
                portfolioId:
                  type: string
                  description: Optional batch-level portfolio ID used when a file has no per-file value
      responses:
        '202':
          description: Batch accepted and processing started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSyncStatus'
        '400':
          description: Invalid input parameters
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /documents/sync/{batchId}/status:
    get:
      tags:
        - Documents
      summary: Get batch sync status
      operationId: getBatchSyncStatus
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Status retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSyncStatus'
        '401':
          description: Unauthorized
        '404':
          description: Batch not found

  /documents/sync/{batchId}/stream:
    get:
      tags:
        - Documents
      summary: Stream batch sync progress via SSE
      operationId: streamBatchSyncProgress
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Server-sent events stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          description: Unauthorized
        '404':
          description: Batch not found

  /documents/types:
    get:
      tags:
        - Documents
      summary: Get supported document types
      description: Retrieve list of supported document types
      operationId: getSupportedDocumentTypes
      responses:
        '200':
          description: Document types retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '500':
          description: Internal server error

components:
  schemas:
    DocumentProcessResponse:
      type: object
      properties:
        processId:
          type: string
          format: uuid
          description: Unique identifier for the processing request
        documentType:
          type: string
          description: Type of document that was processed
        fileName:
          type: string
          description: Name of the processed file
        status:
          $ref: '#/components/schemas/ProcessingStatus'
      required:
        - processId
        - documentType
        - fileName
        - status

    ProcessingStatus:
      type: string
      enum:
        - QUEUED
        - PROCESSING
        - COMPLETED
        - FAILED
      description: Status of the document processing request

    BatchProcessingStatus:
      type: string
      enum:
        - QUEUED
        - PROCESSING
        - COMPLETED
        - FAILED
        - PARTIAL

    FileSyncStatus:
      type: object
      properties:
        fileId:
          type: string
          format: uuid
        fileName:
          type: string
        detectedBroker:
          type: string
        detectedDocumentType:
          type: string
        status:
          $ref: '#/components/schemas/ProcessingStatus'
        errorMessage:
          type: string
        recordsProcessed:
          type: integer
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
      required:
        - fileId
        - fileName
        - status

    BatchSyncStatus:
      type: object
      properties:
        batchId:
          type: string
          format: uuid
        total:
          type: integer
        completed:
          type: integer
        failed:
          type: integer
        overallStatus:
          $ref: '#/components/schemas/BatchProcessingStatus'
        files:
          type: array
          items:
            $ref: '#/components/schemas/FileSyncStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - batchId
        - total
        - overallStatus
        - files
