replicaCount: 1
port: 8080
healthPath: /actuator/health
language: java
entrypoint: "exec java -jar app.jar"
probes:
  liveness:
    path: /actuator/health
  readiness:
    path: /actuator/health

global:
  image:
    registry: ghcr.io/am-portfolio
    pullPolicy: Always
  vault:
    enabled: true
    role: "am-backend-role"
    authPath: "auth/kubernetes"
    serviceAccountName: "am-backend-sa"

image:
  repository: am-document-processor
  pullPolicy: Always
  tag: "latest"

ingress:
  enabled: false

security:
  automountServiceAccountToken: true

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 200m
    memory: 512Mi

vault:
  enabled: true
  role: "am-backend-role"
  secretPaths:
    mongodb:
      path: "secret/data/preprod/infra/mongodb"
      template: |
        {{- with secret "secret/data/preprod/infra/mongodb" -}}
        export MONGODB_USERNAME="{{ .Data.data.username }}"
        export MONGODB_PASSWORD="{{ .Data.data.password }}"
        export MONGODB_DATABASE="{{ if .Data.data.database }}{{ .Data.data.database }}{{ else }}am_doc_intelligence{{ end }}"
        export MONGODB_URL="mongodb://{{ .Data.data.username }}:{{ .Data.data.password }}@{{ if .Data.data.host }}{{ .Data.data.host }}{{ else }}mongodb.infra.svc.cluster.local{{ end }}:27017/{{ if .Data.data.database }}{{ .Data.data.database }}{{ else }}am_doc_intelligence{{ end }}?authSource=admin"
        export MONGODB_AUTHENTICATION_DATABASE="admin"
        {{- end }}
    kafka:
      path: "secret/data/preprod/infra/kafka"
      template: |
        {{- with secret "secret/data/preprod/infra/kafka" -}}
        export SPRING_KAFKA_BOOTSTRAP_SERVERS="{{ if index .Data.data "KAFKA_BOOTSTRAP_SERVERS" }}{{ index .Data.data "KAFKA_BOOTSTRAP_SERVERS" }}{{ else }}kafka.infra.svc.cluster.local:9092{{ end }}"
        {{- end }}

config:
  app:
    SPRING_KAFKA_CONSUMER_GROUP_ID: "am-doc-intelligence"
    APP_KAFKA_TOPIC_DOCUMENT_UPLOADED: "document.uploaded"
    APP_KAFKA_TOPIC_DOCUMENT_PROCESSED: "document.processed"
