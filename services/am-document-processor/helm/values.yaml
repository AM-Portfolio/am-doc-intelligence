replicaCount: 1
port: 8080
service:
  port: 8080
healthPath: /actuator/health
language: java
entrypoint: "exec java -jar app.jar"
probes:
  liveness:
    path: /actuator/health
  readiness:
    path: /actuator/health

global:
  image:
    registry: ghcr.io/am-portfolio
    pullPolicy: Always
  vault:
    enabled: true
    role: "am-backend-role"
    authPath: "auth/kubernetes"
    serviceAccountName: "am-backend-sa"

image:
  repository: am-document-processor
  pullPolicy: Always
  tag: "latest"

ingress:
  enabled: false

security:
  automountServiceAccountToken: true

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 200m
    memory: 512Mi

vault:
  enabled: true
  role: "am-backend-role"
  # Paths are provided per-environment in values.{env}.yaml
  # Mappings (env var → vault key) are in vault-mappings.yaml
  secretPaths: {}

# Prometheus scrape (Plane A — Grafana Service dropdown)
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/actuator/prometheus"

env:
  SPRING_PROFILES_ACTIVE: "preprod,security"
  SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL: "SASL_PLAINTEXT"
  SPRING_KAFKA_PROPERTIES_SASL_MECHANISM: "SCRAM-SHA-256"
  APP_PORTFOLIO_TOPIC: "am-portfolio"
  APP_TRADE_TOPIC: "am-trade"
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://otel-collector.monitoring.svc.cluster.local:4318/v1/traces"
  # 1.0 while validating flows in Tempo; dial back to 0.1 when comfortable
  TRACING_SAMPLING_PROBABILITY: "1.0"
