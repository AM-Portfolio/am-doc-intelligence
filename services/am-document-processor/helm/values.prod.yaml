ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: api.amportfolio.com
      paths:
        - path: /api/v1/processor
          pathType: Prefix

vault:
  secretPaths:
    mongodb: 
      path: "secret/data/prod/infra/mongodb"
    kafka: 
      path: "secret/data/prod/infra/kafka"
    auth:
      path: "secret/data/prod/services/am-auth"
