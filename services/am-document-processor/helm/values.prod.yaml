# Prod — am-document-processor
# Service-level Ingress (same model as am-identity).
environment: prod
replicaCount: 1

ingress:
  enabled: true
  className: "traefik"
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-apps-prod-global-cors@kubernetescrd
  hosts:
    - host: am.asrax.in
      paths:
        - path: /doc/processor
          pathType: Prefix

vault:
  enabled: true
  secretPaths:
    mongodb:
      path: "apps/data/prod/infra/mongodb"
    kafka:
      path: "apps/data/prod/infra/kafka"
    auth:
      path: "apps/data/prod/services/am-auth"
    identity-oidc:
      path: "apps/data/prod/services/am-identity"
    service-oauth:
      path: "apps/data/prod/services/am-document-processor"

env:
  SPRING_PROFILES_ACTIVE: "prod,security"
