# Prod â€” am-email-extractor
environment: prod
replicaCount: 1

ingress:
  enabled: true
  className: "traefik"
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-apps-prod-global-cors@kubernetescrd,
      am-apps-prod-strip-prefix-apps@kubernetescrd
  hosts:
    - host: am.asrax.in
      paths:
        - path: /email
          pathType: Prefix
        - path: /gmail
          pathType: Prefix

vault:
  enabled: true
  secretPaths:
    mongodb:
      path: "apps/data/prod/infra/mongodb"
    kafka:
      path: "apps/data/prod/infra/kafka"
    identity-oidc:
      path: "apps/data/prod/services/am-identity"
    service-oauth:
      path: "apps/data/prod/services/am-email-extractor"
    # Same Web client as Keycloak / modern-ui
    google:
      path: "apps/data/prod/services/am-identity"

env:
  ALLOWED_ORIGINS: "https://am.asrax.in,http://localhost:3000"
  # Must be under env: (universal-chart ignores config.app for container env)
  GMAIL_REDIRECT_URI: "https://am.asrax.in/email/api/v1/gmail/callback"
  GMAIL_UI_SUCCESS_URL: "https://am.asrax.in/app/doc-intel/email-extractor"

global:
  image:
    tag: "local-b553cf0"
