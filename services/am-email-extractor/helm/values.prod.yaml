ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: api.amportfolio.com
      paths:
        - path: /api/v1/extractor
          pathType: Prefix

vault:
  secretPaths:
    mongodb: 
      path: "secret/data/prod/infra/mongodb"
    kafka: 
      path: "secret/data/prod/infra/kafka"
    jwt:
      path: "secret/data/prod/apps/auth/jwt"
    google:
      path: "secret/data/prod/apps/docs/google"

config:
  app:
    GMAIL_REDIRECT_URI: "https://api.amportfolio.com/api/v1/extractor/gmail/callback"
