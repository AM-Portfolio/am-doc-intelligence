# Dev environment overrides for am-email-extractor
environment: dev

replicaCount: 1

# Minimal resources for shared dev namespace
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

env:
  PORT: "8080"
  # Must be under env: (universal-chart ignores config.app for container env)
  GMAIL_REDIRECT_URI: "https://am-dev.asrax.in/email/api/v1/gmail/callback"
  GMAIL_UI_SUCCESS_URL: "https://am-dev.asrax.in/app/doc-intel/email-extractor"

vault:
  enabled: true
  secretPaths:
    mongodb:
      path: "apps/data/dev/infra/mongodb"
    kafka:
      path: "apps/data/dev/infra/kafka"
    jwt:
      path: "apps/data/dev/services/am-email-extractor"
    google:
      path: "apps/data/dev/services/am-identity"
    identity-oidc:
      path: "apps/data/dev/services/am-identity"
    service-oauth:
      path: "apps/data/dev/services/am-email-extractor"

ingress:
  enabled: true
  className: "traefik"
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-apps-dev-dev-global-cors@kubernetescrd,
      am-apps-dev-dev-strip-prefix@kubernetescrd
  hosts:
    - host: am-dev.asrax.in
      paths:
        - path: /email
          pathType: Prefix
        - path: /gmail
          pathType: Prefix
