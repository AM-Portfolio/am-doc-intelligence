replicaCount: 1
port: 8080
language: python

global:
  vault:
    serviceAccountName: "am-backend-sa"

image:
  repository: am-email-extractor
  pullPolicy: Always
  tag: "latest"

ingress:
  enabled: false

security:
  automountServiceAccountToken: true

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 100m
    memory: 256Mi

vault:
  enabled: true
  role: "am-backend-role"
  secretPaths:
    mongodb: 
      path: "secret/data/preprod/infra/mongodb"
      template: |
        {{- with secret "secret/data/preprod/infra/mongodb" -}}
        export MONGODB_DATABASE="{{ .Data.data.MONGODB_DATABASE }}"
        export MONGO_DATABASE="{{ .Data.data.MONGODB_DATABASE }}"
        export MONGODB_URL="mongodb://{{ .Data.data.MONGO_USER }}:{{ .Data.data.MONGO_PASSWORD }}@{{ .Data.data.MONGO_HOST }}:27017/{{ .Data.data.MONGODB_DATABASE }}?authSource=admin"
        {{- end }}
    kafka: 
      path: "secret/data/preprod/infra/kafka"
      template: |
        {{- with secret "secret/data/preprod/infra/kafka" -}}
        export KAFKA_BOOTSTRAP_SERVERS="{{ if index .Data.data "KAFKA_BOOTSTRAP_SERVERS" }}{{ index .Data.data "KAFKA_BOOTSTRAP_SERVERS" }}{{ else }}kafka.infra.svc.cluster.local:9092{{ end }}"
        {{- end }}
    jwt:
      path: "secret/data/preprod/apps/auth/jwt"
      template: |
        {{- with secret "secret/data/preprod/apps/auth/jwt" -}}
        export JWT_SECRET="{{ .Data.data.JWT_SECRET }}"
        {{- end }}
    google:
      path: "secret/data/preprod/apps/docs/google"
      template: |
        {{- with secret "secret/data/preprod/apps/docs/google" -}}
        export GOOGLE_CLIENT_ID="{{ .Data.data.GOOGLE_CLIENT_ID }}"
        export GOOGLE_CLIENT_SECRET="{{ .Data.data.GOOGLE_CLIENT_SECRET }}"
        {{- end }}

config:
  app:
    JWT_ALGORITHM: "HS256"
