replicaCount: 1
port: 8080
service:
  port: 8080
healthPath: /v1/health
language: python
entrypoint: "exec python app_api.py"
probes:
  liveness:
    path: /v1/health
  readiness:
    path: /api/v1/health

global:
  image:
    registry: ghcr.io/am-portfolio
    pullPolicy: Always
  vault:
    enabled: true
    role: "am-backend-role"
    authPath: "auth/kubernetes"
    serviceAccountName: "am-backend-sa"

image:
  repository: am-email-extractor
  pullPolicy: Always
  tag: "latest"

ingress:
  enabled: false

security:
  automountServiceAccountToken: true

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 100m
    memory: 256Mi

vault:
  enabled: true
  role: "am-backend-role"
  secretPaths:
    mongodb:
      path: "apps/data/preprod/infra/mongodb"
    kafka:
      path: "apps/data/preprod/infra/kafka"
    jwt:
      path: "secret/data/preprod/apps/auth/jwt"
    google:
      path: "secret/data/preprod/apps/docs/google"

config:
  app:
    JWT_ALGORITHM: "HS256"
    MONGO_DATABASE: "am-doc-intelligence"
    KAFKA_TOPIC: "am-portfolio"
