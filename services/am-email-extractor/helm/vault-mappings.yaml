vault:
  secretPaths:
    mongodb:
      mappings:
        MONGODB_URL: "url"
    kafka:
      mappings:
        KAFKA_BOOTSTRAP_SERVERS: "bootstrap_servers"
        KAFKA_USERNAME: "username"
        KAFKA_PASSWORD: "password"

    identity-oidc:
      mappings:
        OIDC_JWKS_URL: "OIDC_JWKS_URL"
        OIDC_ISSUER: "OIDC_ISSUER"
    service-oauth:
      mappings:
        OAUTH2_CLIENT_ID: "AM_DOC_INTELLIGENCE_CLIENT_ID"
        OAUTH2_CLIENT_SECRET: "AM_DOC_INTELLIGENCE_CLIENT_SECRET"
