vault:
  secretPaths:
    mongodb:
      mappings:
        MONGODB_URL: "url"
        MONGODB_DATABASE: "database"
    kafka:
      mappings:
        KAFKA_BOOTSTRAP_SERVERS: "bootstrap_servers"
        KAFKA_JAAS_CONFIG: "__jaas__"
    jwt:
      mappings:
        JWT_SECRET: "JWT_SECRET"
    google:
      mappings:
        GOOGLE_CLIENT_ID: "GOOGLE_CLIENT_ID"
        GOOGLE_CLIENT_SECRET: "GOOGLE_CLIENT_SECRET"
