# Preprod — am-email-extractor
# Preprod app host only — am.asrax.in reserved for prod
environment: preprod
replicaCount: 1

ingress:
  enabled: true
  className: "traefik"
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-apps-preprod-global-cors@kubernetescrd,
      am-apps-preprod-strip-prefix-apps@kubernetescrd
  hosts:
    - host: am-preprod.asrax.in
      paths:
        - path: /email
          pathType: Prefix
        - path: /gmail
          pathType: Prefix

vault:
  enabled: true
  secretPaths:
    mongodb:
      path: "apps/data/preprod/infra/mongodb"
    kafka:
      path: "apps/data/preprod/infra/kafka"
    identity-oidc:
      path: "apps/data/preprod/services/am-identity"
    service-oauth:
      path: "apps/data/preprod/services/am-email-extractor"
    # Same Web client as Keycloak / modern-ui
    google:
      path: "apps/data/preprod/services/am-identity"

env:
  ALLOWED_ORIGINS: "https://am-preprod.asrax.in,http://localhost:3000"
  # Must be under env: (universal-chart ignores config.app for container env)
  GMAIL_REDIRECT_URI: "https://am-preprod.asrax.in/email/api/v1/gmail/callback"
  GMAIL_UI_SUCCESS_URL: "https://am-preprod.asrax.in/app/doc-intel/email-extractor"
  MARKET_DATA_BASE_URL: "https://am-preprod.asrax.in/market"
