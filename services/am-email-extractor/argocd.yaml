apiVersion: am.argocd/v1
kind: ServiceDeploy
service: am-email-extractor
enabled: true
owners: doc-intelligence
source:
  repo: am-doc-intelligence
  path: services/am-email-extractor/argocd.yaml
chart:
  repoURL: https://github.com/AM-Portfolio/am-pipelines.git
  path: helm/universal-chart
  targetRevision: main
helm:
  releaseName: am-email-extractor
  valuesPath: services/am-email-extractor/helm
valuesRepoURL: https://github.com/AM-Portfolio/am-doc-intelligence.git
valuesTargetRevision: main
envs:
  prod:
    enabled: true
    namespace: am-apps-prod
