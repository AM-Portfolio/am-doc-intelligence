# NPS scheme catalog: (pf, scheme, tier, option) → CRA schemeCode (NAV/ISIN key).
# Local fallback when MARKET_DATA_BASE_URL /v1/nps/resolve is unreachable.
# Live NAV + resolve SoT = am-market-data GET/POST /v1/nps/* (MARKET_DATA_BASE_URL).
# Wire field `isin` carries schemeCode (SM00…) until classic INF ISINs are in market-data.

version: 1
entries:
  # Tier I — POP / common (statement "POP")
