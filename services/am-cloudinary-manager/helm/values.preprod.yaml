# Preprod — am-cloudinary-manager
# Dual-host: am-preprod (target) + am.asrax.in until Phase 4
environment: preprod
replicaCount: 1

ingress:
  enabled: true
  className: "traefik"
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-apps-preprod-global-cors@kubernetescrd,
      am-apps-preprod-strip-prefix-apps@kubernetescrd
  hosts:
    - host: am-preprod.asrax.in
      paths:
        - path: /v1/cloudinary
          pathType: Prefix
    - host: am.asrax.in
      paths:
        - path: /v1/cloudinary
          pathType: Prefix

vault:
  enabled: true
  secretPaths:
    cloudinary:
      path: "apps/data/preprod/services/am-cloudinary-manager"
    identity-oidc:
      path: "apps/data/preprod/services/am-identity"
    service-oauth:
      path: "apps/data/preprod/services/am-cloudinary-manager"
