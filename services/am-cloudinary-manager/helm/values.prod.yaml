ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: api.amportfolio.com
      paths:
        - path: /v1/cloudinary
          pathType: Prefix

vault:
  secretPaths:
    cloudinary:
      path: "secret/data/prod/apps/docs/cloudinary"
    identity-oidc:
      path: "secret/data/prod/services/am-identity"
    service-oauth:
      path: "secret/data/prod/services/am-cloudinary-manager"
