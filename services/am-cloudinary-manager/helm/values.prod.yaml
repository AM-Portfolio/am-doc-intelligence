# Prod — am-cloudinary-manager
environment: prod
replicaCount: 1

ingress:
  enabled: true
  className: "traefik"
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    # Path is already /v1/cloudinary (matches app); CORS only — no strip-prefix.
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-apps-prod-global-cors@kubernetescrd
  hosts:
    - host: am.asrax.in
      paths:
        - path: /v1/cloudinary
          pathType: Prefix

env:
  SPRING_PROFILES_ACTIVE: "prod,security"

vault:
  enabled: true
  secretPaths:
    # Credentials live under shared (same pattern as google): apps → prod → shared → cloudinary
    cloudinary:
      path: "apps/data/prod/shared/cloudinary"
    identity-oidc:
      path: "apps/data/prod/services/am-identity"
    service-oauth:
      path: "apps/data/prod/services/am-cloudinary-manager"
