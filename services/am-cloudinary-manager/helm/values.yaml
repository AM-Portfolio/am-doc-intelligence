replicaCount: 1
port: 8080
service:
  port: 8080
healthPath: /actuator/health
language: java
entrypoint: "exec java -jar app.jar"
probes:
  liveness:
    path: /actuator/health
  readiness:
    path: /actuator/health

global:
  image:
    registry: ghcr.io/am-portfolio
    pullPolicy: Always
  vault:
    enabled: true
    role: "am-backend-role"
    authPath: "auth/kubernetes"
    serviceAccountName: "am-backend-sa"

image:
  repository: am-cloudinary-manager
  pullPolicy: Always
  tag: "latest"

ingress:
  enabled: false

security:
  automountServiceAccountToken: true

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

vault:
  enabled: true
  role: "am-backend-role"
  secretPaths:
    cloudinary:
      path: "apps/data/preprod/shared/cloudinary"
    identity-oidc:
      path: "apps/data/preprod/services/am-identity"
    service-oauth:
      path: "apps/data/preprod/services/am-cloudinary-manager"

# Prometheus scrape (Plane A — Grafana Service dropdown)
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/actuator/prometheus"

config:
  app:
    env: "preprod"

env:
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://otel-collector.monitoring.svc.cluster.local:4318/v1/traces"
  # 1.0 while validating flows in Tempo; dial back to 0.1 when comfortable
  TRACING_SAMPLING_PROBABILITY: "1.0"
