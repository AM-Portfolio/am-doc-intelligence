am:
  security:
    enabled: true
    proxy-name: "cloudinary"
    oidc:
      jwk-set-uri: ${OIDC_JWKS_URI:http://localhost:8001/realms/am-realm/protocol/openid-connect/certs}
      issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8001/realms/am-realm}
      client-id: ${OAUTH2_CLIENT_ID:am-cloudinary-client}
      client-secret: ${OAUTH2_CLIENT_SECRET:secret}
    public-paths:
      - "/actuator/**"
      - "/cloudinary/actuator/**"
    protected-paths:
      - "/v1/cloudinary/**"
  api:
    core:
      exception-handler:
        enabled: true
