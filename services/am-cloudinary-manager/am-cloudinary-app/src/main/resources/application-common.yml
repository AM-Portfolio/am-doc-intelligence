# Common configuration shared across all environments

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState
        liveness:
          include: livenessState
  metrics:
    tags:
      # Required for Grafana Technical / Services Service dropdown
      application: ${spring.application.name}
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    enabled: true
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

otel:
  service:
    name: ${spring.application.name}
    namespace: am-doc-intelligence

# Logging configuration
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    '[org.springframework]': INFO
    '[com.amportfolio.cloudinary]': INFO

# Default Cloudinary settings (overridden in profile-specific configs)
cloudinary:
  defaultFolder: uploads
  secure: true
