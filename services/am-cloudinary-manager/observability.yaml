apiVersion: am.obs/v1
kind: ServiceObservability
service: am-cloudinary-manager
tier: A
runtime: java
k8s_app_label: am-cloudinary-manager
# spring.application.name → Prom label application=
metrics_application: am-cloudinary
namespace: am-apps-preprod
owners: [doc-intelligence]
signals:
  bundle: tier-a-java-core
  domain: []
  include: []
dashboard:
  technical:
    rows:
      hide: [row_mongo, row_redis, row_kafka]
      collapse: [row_jvm, row_k8s]
