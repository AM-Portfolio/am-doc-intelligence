name: Debug Flutter Build
on:
  push:
    branches: ["**"]

jobs:
  debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Git Config
        run: |
          git config --global url."https://x-access-token:${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: Pub Get
        working-directory: apps/am-doc-viewer-ui
        run: flutter pub get
      - name: Analyze
        working-directory: apps/am-doc-viewer-ui
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build Web
        working-directory: apps/am-doc-viewer-ui
        run: flutter build web --release --base-href /doc-ui/ > build_log.txt 2>&1 || true
      - name: Commit log
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add apps/am-doc-viewer-ui/build_log.txt
          git commit -m "chore: upload build log [skip ci]" || echo "No changes to commit"
          git push
