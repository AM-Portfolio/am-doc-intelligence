name: AM Doc Intelligence CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Create Maven settings.xml
        run: |
          mkdir -p ~/.m2
          cat << 'EOF' > ~/.m2/settings.xml
          <settings>
            <servers>
              <server>
                <id>github-core</id>
                <username>${env.GITHUB_PACKAGES_USERNAME}</username>
                <password>${env.GITHUB_PACKAGES_TOKEN}</password>
              </server>
              <server>
                <id>github</id>
                <username>${env.GITHUB_PACKAGES_USERNAME}</username>
                <password>${env.GITHUB_PACKAGES_TOKEN}</password>
              </server>
              <server>
                <id>github-investment</id>
                <username>${env.GITHUB_PACKAGES_USERNAME}</username>
                <password>${env.GITHUB_PACKAGES_TOKEN}</password>
              </server>
              <server>
                <id>github-trade</id>
                <username>${env.GITHUB_PACKAGES_USERNAME}</username>
                <password>${env.GITHUB_PACKAGES_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Install dependencies and Run Tests
        run: |
          npm install
          npm run test:all
        env:
          GITHUB_PACKAGES_USERNAME: ${{ github.actor }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
