name: AM Cloudinary Manager

on:
  push:
    branches: ["main", "develop", "feature/**", "test/**", "fix/**", "hotfix/**"]
    paths:
      - 'services/am-cloudinary-manager/**'
  pull_request:
    branches: ["main", "develop", "feature/**", "test/**", "fix/**", "hotfix/**"]
    paths:
      - 'services/am-cloudinary-manager/**'
  workflow_dispatch:

jobs:
  publish:
    name: Build and Publish
    permissions:
      contents: read
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-build-publish.yml@develop
    with:
      language: 'java'
      working_directory: 'services/am-cloudinary-manager'
      image_name: 'am-cloudinary-manager'
      build_context: '.'
      preprod_namespace: 'am-apps-preprod'
      prod_namespace: 'am-apps-prod'
      deploy_prod: false
    secrets: inherit
