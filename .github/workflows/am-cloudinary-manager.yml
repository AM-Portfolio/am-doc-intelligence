name: AM Cloudinary Manager

on:
  push:
    branches: ["main", "develop", "feature/**", "test/**", "fix/**", "hotfix/**"]
    paths:
      - 'services/am-cloudinary-manager/**'
      - '.github/workflows/am-cloudinary-manager.yml'
  pull_request:
    branches: ["main", "develop", "feature/**", "test/**", "fix/**", "hotfix/**"]
    paths:
      - 'services/am-cloudinary-manager/**'
      - '.github/workflows/am-cloudinary-manager.yml'
  workflow_dispatch:

jobs:
  publish:
    name: Build and Publish
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-build-publish.yml@feature/parameterizable-runners
    with:
      language: 'java'
      working_directory: 'services/am-cloudinary-manager'
      image_name: 'am-cloudinary-manager'
      build_context: '.'
      preprod_namespace: 'am-apps-preprod'
      prod_namespace: 'am-apps-prod'
      dev_namespace: 'am-apps-dev'
      deploy_dev: true
      deploy_prod: false
      dev_runner_labels: '["self-hosted", "Linux", "X64", "docker", "dev"]'
      preprod_runner_labels: '["self-hosted", "Linux", "X64", "docker", "preprod"]'
    secrets: inherit
