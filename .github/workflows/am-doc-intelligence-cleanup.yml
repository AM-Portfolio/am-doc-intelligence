name: Container Cleanup — AM Doc Intelligence

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service name"
        required: true
        type: choice
        options:
          - am-cloudinary-manager
          - am-document-processor
          - am-email-extractor
      tag:
        description: "Image tag to delete (e.g. sha-abc1234)"
        required: true
        type: string

jobs:
  cleanup:
    name: Delete ${{ github.event.inputs.service }} image tag — ${{ github.event.inputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete container image tag
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.inputs.service }}
          package-type: "container"
          min-versions-to-keep: 5
          delete-only-pre-release-versions: "false"
