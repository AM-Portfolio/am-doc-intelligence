name: AM Doc Viewer UI Publish

on:
  push:
    branches: ["main", "develop", "feature/**", "test/**", "fix/**", "hotfix/**"]
    paths:
      - 'apps/am-doc-viewer-ui/**'
      - '.github/workflows/am-doc-viewer-ui-publish.yml'
  pull_request:
    branches: ["main", "develop"]
    paths:
      - 'apps/am-doc-viewer-ui/**'
  workflow_dispatch:

jobs:
  publish:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: apps/am-doc-viewer-ui
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
          tags: ghcr.io/am-portfolio/am-doc-viewer-ui:${{ github.run_id }}
          build-args: |
            BASE_REGISTRY=ghcr.io/am-portfolio/
            GITHUB_PACKAGES_USERNAME=${{ github.actor }}
            GITHUB_PACKAGES_TOKEN=${{ secrets.GITHUB_TOKEN }}
            BUILD_ID=${{ github.run_id }}
