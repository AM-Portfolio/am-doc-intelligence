# Manual Contabo Argo deploy for all 4 envs — waits Healthy/Synced or FAILS.
# Job uses GitHub Environment ${{ inputs.environment }} so Required reviewers
# (Settings → Environments: dev, preprod, prod, dr) must Approve before Contabo runs.
# preprod also auto-deploys on main merge via Publish; use this to re-roll or pin a tag.
# prod/dr: after Approve → promote PR → human CODEOWNERS merge → Contabo sync+wait.
name: Manual Deploy (am-cloudinary-manager)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "GHCR tag (leave empty = use current preprod pin from am-gitops)"
        required: false
        type: string
        default: ""
      environment:
        description: "Target Environment (Contabo Argo only; GitHub Environment approval)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - preprod
          - prod
          - dr

permissions:
  contents: read
  actions: write

jobs:
  deploy:
    name: Contabo Argo → ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout am-pipelines scripts
        uses: actions/checkout@v4
        with:
          repository: AM-Portfolio/am-pipelines
          path: am-pipelines-repo
          ref: main
          token: ${{ secrets.GITHUB_PAT || secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: tag
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          TAG_IN: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          SVC=am-cloudinary-manager
          TAG="$TAG_IN"
          if [[ -z "$TAG" ]]; then
            echo "Fetching current preprod tag from ArgoCD..."
            chmod +x am-pipelines-repo/scripts/ci/argo-api-lib.sh
            source am-pipelines-repo/scripts/ci/argo-api-lib.sh
            RAW="$(argo_api GET "/api/v1/applications/${SVC}-preprod")"
            TAG=$(echo "$RAW" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next((p.get("value") for src in d.get("spec",{}).get("sources",[]) for p in src.get("helm",{}).get("parameters",[]) if p.get("name")=="global.image.tag"), ""))')
            echo "Resolved tag from ArgoCD preprod: ${TAG}"
          fi
          if [[ -z "$TAG" ]]; then
            echo "::error::No image tag — pass image_tag or ensure preprod app exists in ArgoCD"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Deploy + verify Contabo (dev/preprod)
        if: inputs.environment == 'dev' || inputs.environment == 'preprod'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_PAT || secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          INPUT_SERVICE_NAME: am-cloudinary-manager
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          chmod +x am-pipelines-repo/scripts/ci/argo-api-lib.sh
          chmod +x am-pipelines-repo/scripts/ci/argo-roll-image-and-wait.sh
          am-pipelines-repo/scripts/ci/argo-roll-image-and-wait.sh

      - name: Promote + verify Contabo (prod/dr)
        if: inputs.environment == 'prod' || inputs.environment == 'dr'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_PAT || secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          INPUT_SERVICE_NAME: am-cloudinary-manager
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          chmod +x am-pipelines-repo/scripts/ci/argo-api-lib.sh
          chmod +x am-pipelines-repo/scripts/ci/argo-promote-and-wait.sh
          am-pipelines-repo/scripts/ci/argo-promote-and-wait.sh
