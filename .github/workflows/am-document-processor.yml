name: AM Document Processor Publish

on:
  push:
    branches: ["main", "develop", "feature/**", "test/**", "fix/**", "hotfix/**"]
    paths:
      - 'services/am-document-processor/**'
      - '.github/workflows/am-document-processor-publish.yml'
  pull_request:
    branches: ["main", "develop"]
    paths:
      - 'services/am-document-processor/**'
  workflow_dispatch:

jobs:
  publish:
    name: Publish UI
    permissions:
      contents: write
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-build-publish-contabo.yml@main
    with:
      language: 'java'
      working_directory: 'services/am-document-processor'
      image_name: 'am-document-processor'
      build_context: '.'
      skip_secrets_scan: true
    secrets: inherit
