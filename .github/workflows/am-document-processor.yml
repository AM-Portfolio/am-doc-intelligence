name: AM Document Processor

permissions:
  contents: write
  packages: write
  id-token: write

on:
  push:
    branches: ["main", "develop", "feature/**", "test/**", "fix/**", "hotfix/**"]
    paths:
      - 'services/am-document-processor/**'
      - '.github/workflows/am-document-processor.yml'
  pull_request:
    branches: ["main", "develop", "feature/**", "test/**", "fix/**", "hotfix/**"]
    paths:
      - 'services/am-document-processor/**'
      - '.github/workflows/am-document-processor.yml'
  workflow_dispatch:

jobs:
  publish:
    name: Build and Publish
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-build-publish.yml@main
    with:
      language: 'java'
      working_directory: 'services/am-document-processor'
      image_name: 'am-document-processor'
      build_context: '.'
      preprod_namespace: 'am-apps-preprod'
      prod_namespace: 'am-apps-prod'
      deploy_dev: false
      deploy_preprod: true
      deploy_prod: false
    secrets: inherit
