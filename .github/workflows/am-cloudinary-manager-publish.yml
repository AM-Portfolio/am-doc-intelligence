name: AM Cloudinary Manager Publish

on:
  push:
    branches: ["main", "develop", "feature/**", "test/**", "fix/**", "hotfix/**"]
    paths:
      - 'services/am-cloudinary-manager/**'
      - '.github/workflows/am-cloudinary-manager-publish.yml'
  pull_request:
    branches: ["main", "develop"]
    paths:
      - 'services/am-cloudinary-manager/**'
  workflow_dispatch:

jobs:
  publish:
    name: Build & Publish
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/central-build-publish-no-deploy.yml
    with:
      language: 'java'
      working_directory: 'services/am-cloudinary-manager'
      image_name: 'am-cloudinary-manager'
      build_context: 'services/am-cloudinary-manager'
      skip_secrets_scan: true
    secrets: inherit
