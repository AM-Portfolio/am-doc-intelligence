name: AM Doc Viewer UI Publish

on:
  push:
    branches: ["main", "develop", "test/**", "fix/**", "hotfix/**"]
    paths:
      - 'apps/am-doc-viewer-ui/**'
  pull_request:
    branches: ["main", "develop", "test/**", "fix/**", "hotfix/**"]
    paths:
      - 'apps/am-doc-viewer-ui/**'
  workflow_dispatch:

jobs:
  publish:
    name: Publish UI
    permissions:
      contents: read
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-build-publish.yml@develop
    with:
      language: 'flutter'
      working_directory: 'apps/am-doc-viewer-ui'
      image_name: 'am-doc-viewer-ui'
      preprod_namespace: 'am-apps-preprod'
      prod_namespace: 'am-apps-prod'
      deploy_prod: false
    secrets: inherit
