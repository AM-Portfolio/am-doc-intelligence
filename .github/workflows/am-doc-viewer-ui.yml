name: AM Doc Viewer UI Publish

on:
  push:
    branches: ["main", "develop", "feature/**", "test/**", "fix/**", "hotfix/**"]
    paths:
      - 'apps/am-doc-viewer-ui/**'
      - '.github/workflows/am-doc-viewer-ui.yml'
  pull_request:
    branches: ["main", "develop", "feature/**", "test/**", "fix/**", "hotfix/**"]
    paths:
      - 'apps/am-doc-viewer-ui/**'
      - '.github/workflows/am-doc-viewer-ui.yml'
  workflow_dispatch:

jobs:
  publish:
    name: Publish UI
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-build-publish.yml@feature/parameterizable-runners
    with:
      language: 'flutter'
      working_directory: 'apps/am-doc-viewer-ui'
      image_name: 'am-doc-viewer-ui'
      preprod_namespace: 'am-apps-preprod'
      prod_namespace: 'am-apps-prod'
      dev_namespace: 'am-apps-dev'
      deploy_dev: true
      deploy_prod: false
      dev_runner_labels: '["self-hosted", "Linux", "X64", "docker", "dev"]'
      preprod_runner_labels: '["self-hosted", "Linux", "X64", "docker", "preprod"]'
    secrets: inherit
