name: Manual Deploy (workflowsam-email-extractor)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Select Image Tag"
        required: true
        default: "latest"
        type: choice
        options:
          - latest
          - custom
      custom_tag:
        description: "If 'custom' selected, enter tag here"
        required: false
        type: string
      environment:
        description: "Target Environment"
        required: true
        default: "preprod"
        type: choice
        options:
          - dev
          - preprod
          - prod
          - dr

jobs:
  deploy:
    name: Deploy workflowsam-email-extractor to ${{ github.event.inputs.environment }}
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-deploy.yml@main
    with:
      service_name: "workflowsam-email-extractor"
      working_directory: "services/workflowsam-email-extractor"
      language: "python"
      environment: ${{ github.event.inputs.environment }}
      image_tag: ${{ github.event.inputs.image_tag == 'custom' && github.event.inputs.custom_tag || github.event.inputs.image_tag }}
      namespace: ${{ (github.event.inputs.environment == 'prod' || github.event.inputs.environment == 'dr') && 'am-apps-prod' || 'am-apps-preprod' }}
    secrets: inherit
