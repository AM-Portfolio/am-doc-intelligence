name: AM Email Extractor Publish

on:
  push:
    branches: ["main", "develop", "feature/**", "test/**", "fix/**", "hotfix/**"]
    paths:
      - 'services/am-email-extractor/**'
      - '.github/workflows/am-email-extractor-publish.yml'
  pull_request:
    branches: ["main", "develop"]
    paths:
      - 'services/am-email-extractor/**'
  workflow_dispatch:

jobs:
  publish:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Stage am-platform-security
        run: |
          git clone https://${{ secrets.GITHUB_TOKEN }}@github.com/AM-Portfolio/am-platform.git /tmp/am-platform
          mkdir -p services/am-email-extractor/third_party
          cp -r /tmp/am-platform/libraries/am-platform-security services/am-email-extractor/third_party/

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: services/am-email-extractor
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
          tags: ghcr.io/am-portfolio/am-email-extractor:${{ github.run_id }}
          build-args: |
            BASE_REGISTRY=ghcr.io/am-portfolio/
            GITHUB_PACKAGES_USERNAME=${{ github.actor }}
            GITHUB_PACKAGES_TOKEN=${{ secrets.GITHUB_TOKEN }}
            BUILD_ID=${{ github.run_id }}
